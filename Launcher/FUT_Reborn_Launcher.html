<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FUT Reborn Launcher</title>
<style>
:root{--red:#ed1c24;--green:#00c25f;--sun:#ffc929;--gold:#e0b050;--ink:#05070a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:#020304;color:#f2f4f8;font-family:"Rajdhani","Segoe UI",Tahoma,sans-serif;overflow-x:hidden}
@property --a{syntax:"<angle>";initial-value:0deg;inherits:false}
@keyframes spin{to{--a:360deg}}
.win{width:min(900px,100%);height:560px;position:relative;overflow:hidden;border-radius:16px;background:var(--ink);box-shadow:0 0 60px rgba(237,28,36,.18),0 0 60px rgba(0,194,95,.18)}
canvas{position:absolute;inset:0;width:100%;height:100%}
.led{position:absolute;inset:0;border-radius:16px;padding:3px;background:conic-gradient(from var(--a),var(--red),#fff,var(--green),var(--sun),var(--red));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin 5s linear infinite;pointer-events:none;z-index:9}
.mount{position:absolute;left:0;right:0;bottom:0;height:150px;z-index:1;opacity:.9}
.top{position:relative;z-index:3;display:flex;justify-content:space-between;align-items:center;padding:12px 20px;background:linear-gradient(#0b0f16cc,#0b0f1600)}
.top b{font-size:13px;letter-spacing:.3em;color:var(--gold)}
.ctl{display:flex;gap:7px}.ctl i{width:11px;height:11px;border-radius:50%;background:#2c3342}
.ctl i:last-child{background:var(--red)}
.flag{position:relative;z-index:3;height:6px;background:linear-gradient(90deg,var(--red) 33.3%,#fff 33.3% 66.6%,var(--green) 66.6%);box-shadow:0 0 14px rgba(255,255,255,.4)}
.main{position:relative;z-index:3;display:grid;grid-template-columns:1fr 1.1fr;gap:10px;padding:14px 30px;height:calc(100% - 110px)}
.left{display:grid;place-items:center;perspective:700px}
.stage{position:relative;width:250px;height:250px;transform-style:preserve-3d;transition:transform .1s}
.ring{position:absolute;inset:-18px;border-radius:50%;background:conic-gradient(from var(--a),transparent 0 20%,var(--sun),transparent 45%,var(--red) 60%,transparent 70%,var(--green) 90%,transparent);-webkit-mask:radial-gradient(circle,transparent 66%,#000 67%);mask:radial-gradient(circle,transparent 66%,#000 67%);animation:spin 4s linear infinite;filter:drop-shadow(0 0 8px var(--sun))}
.sunbg{position:absolute;inset:-60px;animation:rot 30s linear infinite;opacity:.55}
@keyframes rot{to{transform:rotate(360deg)}}
.logo{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;object-fit:cover;box-shadow:0 0 0 4px #111,0 0 50px rgba(255,201,41,.55);transform:translateZ(40px)}
.right{display:flex;flex-direction:column;justify-content:center;gap:11px;padding-left:6px}
.pill{align-self:flex-start;display:flex;gap:8px;align-items:center;padding:5px 12px;border:1px solid #0f6b3a;border-radius:99px;background:#06180f;color:var(--green);font-weight:700;font-size:13px;letter-spacing:.12em}
.dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green);animation:bl 1.4s infinite}
@keyframes bl{50%{opacity:.3}}
h1{margin:0;font-size:60px;line-height:.9;font-weight:700;font-style:italic;background:linear-gradient(100deg,#fff 0,var(--sun) 45%,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px rgba(255,201,41,.4));position:relative}
h1 small{display:block;font-size:22px;letter-spacing:.38em;font-style:normal;margin-top:6px;background:linear-gradient(90deg,var(--red),#fff,var(--green));-webkit-background-clip:text;background-clip:text;color:transparent;filter:none}
.who{font-size:14px;color:#9aa4b8;letter-spacing:.06em}.who strong{color:#fff}.who em{color:var(--gold);font-style:normal;font-weight:700}
.sel{display:flex;gap:8px}
.path{flex:1;min-width:0;padding:11px 13px;border-radius:8px;background:#0a0e15cc;border:1px solid #28303f;font-size:14px;color:#aab3c5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;backdrop-filter:blur(6px)}
.path.ok{color:#fff;border-color:var(--green);box-shadow:0 0 12px rgba(0,194,95,.3)}
button{font:inherit;color:#fff;border:0;cursor:pointer}
.br{padding:0 16px;border-radius:8px;background:#1a2231;border:1px solid #333d52;font-weight:700}
.br:hover{border-color:var(--sun)}
.play{position:relative;overflow:hidden;padding:16px;border-radius:10px;font-size:26px;font-weight:700;letter-spacing:.35em;background:linear-gradient(90deg,var(--red),#b3121a 38%,#079a4f 62%,var(--green));box-shadow:0 0 28px rgba(237,28,36,.5),0 0 28px rgba(0,194,95,.5);transition:transform .15s}
.play:hover{transform:scale(1.025)}.play:active{transform:scale(.98)}
.play::after{content:"";position:absolute;top:0;left:-60%;width:35%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);animation:sh 2.8s infinite}
@keyframes sh{to{left:140%}}
.prog{height:6px;border-radius:9px;background:#141a25;overflow:hidden;opacity:0;transition:opacity .3s}
.prog.on{opacity:1}.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--red),var(--sun),var(--green));box-shadow:0 0 10px var(--sun)}
.msg{min-height:18px;font-size:13px;color:var(--gold);letter-spacing:.1em}
.stats{display:flex;gap:10px}
.stats div{flex:1;padding:8px 10px;border-radius:8px;background:#0a0e15b3;border:1px solid #1f2634;font-size:11px;color:#8590a6}
.stats b{display:block;font-size:20px;color:#fff;letter-spacing:.03em}
.eq{display:flex;align-items:flex-end;gap:2px;height:20px}
.eq u{width:4px;background:var(--green);animation:eq 1s ease-in-out infinite}
@keyframes eq{50%{height:20%}}
.foot{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:11px;color:#6d7790;z-index:4;letter-spacing:.1em}
:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
@media(max-width:680px){.win{height:auto;min-height:820px}.main{grid-template-columns:1fr}.stage{width:180px;height:180px;margin:20px 0}h1{font-size:44px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
